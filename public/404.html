<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Junchen Xiong</title>
    <!-- Standalone: Cloudflare Pages serves this file for unknown addresses, outside the React app. -->
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f6f4ef;
        color: #1b1d3d;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      p {
        margin: 0;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.875rem;
        color: #12705a;
      }
      h1 {
        margin: 0.75rem 0 1.75rem;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        letter-spacing: -0.02em;
      }
      a {
        display: inline-block;
        border-radius: 999px;
        background: #1b1d3d;
        color: #f6f4ef;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #12705a;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">&gt; 404: page not found</p>
      <h1>This page doesn’t exist.</h1>
      <a href="/">Go to junchenxiong.com</a>
    </main>
  </body>
</html>
