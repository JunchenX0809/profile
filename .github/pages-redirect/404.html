<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Junchen Xiong · moved to junchenxiong.com</title>
    <link rel="canonical" href="https://junchenxiong.com/" />
    <!-- GitHub Pages can't send real redirects. The script keeps the path and
         section (e.g. /profile/#experience → junchenxiong.com/#experience);
         the meta refresh covers browsers without JavaScript. -->
    <script>
      location.replace(
        'https://junchenxiong.com' + location.pathname.replace(/^\/profile/, '') + location.search + location.hash,
      )
    </script>
    <meta http-equiv="refresh" content="0; url=https://junchenxiong.com/" />
  </head>
  <body>
    <p>This site moved to <a href="https://junchenxiong.com/">junchenxiong.com</a>.</p>
  </body>
</html>
